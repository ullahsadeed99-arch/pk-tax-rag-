[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pk-tax-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF",
    "pdfplumber",
    "python-dotenv",
    "tiktoken",
    "openai",
    "tqdm",
    "openpyxl",
]

[tool.setuptools.packages.find]
include = ["src*"]
