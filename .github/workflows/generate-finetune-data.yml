name: Generate fine-tune Q&A data

on:
  workflow_dispatch:
    inputs:
      target_per_doc:
        description: "Target Q&A pairs per document"
        required: false
        default: "2000"
  schedule:
    # Once a day -- Groq's free tier resets on a rolling daily token budget,
    # so a single run can't necessarily finish all 3 documents; this lets the
    # resumable script pick up where it left off once quota frees up.
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1   # sequential: all 3 docs share the same Groq account's
                         # rate limit, so running them concurrently just causes
                         # more 429s instead of going faster
      fail-fast: false
      matrix:
        doc:
          - "Income Tax Rules 2002"
          - "Sales Tax Act 1990"
          - "Sales Tax Rules 2006"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Generate Q&A pairs for ${{ matrix.doc }}
        timeout-minutes: 320
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/generate_finetune_data.py \
            --doc "${{ matrix.doc }}" \
            --target "${{ github.event.inputs.target_per_doc || '2000' }}"

      - name: Commit and push progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/finetune_raw.jsonl data/processed/finetune_dataset.jsonl
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Generate Q&A pairs for ${{ matrix.doc }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
